[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "django-fail-better"
description = """\
    A drop-in TEST_RUNNER for Django's manage.py test that brings pytest-style workflow features to the native Django \
    test runner. No pytest migration required.\
    """
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ülgen Sarıkavak", email = "foss@ulgenwanders.net" },
]
requires-python = ">=3.12,<3.16"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dynamic = [ "version" ]
dependencies = [
    "django>=5.2,<6.2",
]

[project.urls]
Homepage = "https://github.com/ulgens/django-fail-better"
Source = "https://github.com/ulgens/django-fail-better"
Issues = "https://github.com/ulgens/django-fail-better/issues"

[dependency-groups]
dev = [
    "copier==9.17.2",
    "copier-template-extensions==0.3.3",
    "ipdb==0.13.13",
    "ipython==9.16.1",
    # Having ruff in the venv helps with IDE's auto lint/format integrations
    "ruff==0.16.4",
    "ty==0.0.73",
    { include-group = "pytest" },
]
pytest = [
    "pytest==9.1.1",
    "pytest-randomly==4.1.0",
    "pytest-xdist==3.8.0",
]

[tool.hatch.version]
path = "src/django_fail_better/__init__.py"

[tool.uv]
# The earliest version that supports the current lock file revision
required-version = ">=0.8.4"
